<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pi Cam Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Live Camera (Rotated 90° CW, Landscape)</h1>
      <img class="video" src="{{ url_for('video') }}" alt="camera">
    </div>
    <div class="card">
      <h1>Now</h1>
      <div class="grid2">
        <div class="stat"><div class="label">Temperature</div><div class="value" id="tNow">—</div></div>
        <div class="stat"><div class="label">Humidity</div><div class="value" id="hNow">—</div></div>
        <div class="stat"><div class="label">Soil Moisture</div><div class="value" id="sNow">—</div></div>
        <div class="stat"><div class="label">Last Update</div><div class="value" id="timeNow">—</div></div>
      </div>
    </div>
    <div class="card"><h1>Temperature (°C)</h1><canvas id="tChart"></canvas></div>
    <div class="card"><h1>Humidity (%)</h1><canvas id="hChart"></canvas></div>
  </div>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
